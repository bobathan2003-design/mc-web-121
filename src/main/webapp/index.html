<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MCWeb 1.21.11</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            font-family: 'Segoe UI', monospace;
            color: #fff;
            overflow: hidden;
        }
        #header {
            margin-bottom: 10px;
            font-size: 14px;
            color: #aaa;
        }
        #game {
            border: 2px solid #333;
            cursor: crosshair;
        }
        #log {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
            max-height: 100px;
            overflow-y: auto;
            width: 854px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="header">MCWeb 1.21.11 — OpenGL→WebGL2 Translation Layer</div>
    <canvas id="game" width="854" height="480"></canvas>
    <div id="log"></div>

    <script>
        var origLog = console.log;
        var logDiv = document.getElementById('log');
        console.log = function() {
            origLog.apply(console, arguments);
            var msg = Array.prototype.join.call(arguments, ' ');
            if (msg.indexOf('[MCWeb]') >= 0) {
                logDiv.innerHTML += msg + '<br>';
                logDiv.scrollTop = logDiv.scrollHeight;
            }
        };

        // Global tick function that Java will set
        window._mcweb_tick = null;
    </script>

    <script src="classes.js"></script>
    <script>
        // Start Java main
        main();

        // Start render loop
        function renderLoop() {
            if (window._mcweb_tick) {
                try {
                    window._mcweb_tick();
                } catch(e) {
                    console.error('Frame error:', e);
                }
            }
            requestAnimationFrame(renderLoop);
        }
        requestAnimationFrame(renderLoop);
    </script>
</body>
</html>
